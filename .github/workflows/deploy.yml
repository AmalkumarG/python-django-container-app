name: Build Push and Update Manifest

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: amalkumargp/python-k8s

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Image
      run: |
        docker build -t $IMAGE_NAME:${{ github.sha }} .

    - name: Push Image
      run: |
        docker push $IMAGE_NAME:${{ github.sha }}

    - name: Clone Manifest Repo
      run: |
        git clone https://x-access-token:${{ secrets.MANIFEST_REPO_PAT }}@github.com/AmalkumarG/k8-aws-ec2-cluster.git

    - name: Update Deployment Image
      run: |
        cd k8-aws-ec2-cluster

        sed -i "s|image:.*|image: $IMAGE_NAME:${{ github.sha }}|" deployment.yml

    - name: Commit Changes
      run: |
        cd k8s-manifests

        git config user.email "github-actions@github.com"
        git config user.name "github-actions"

        git add deployment.yml

        git commit -m "Update image to ${{ github.sha }}" || echo "No changes"

        git push
